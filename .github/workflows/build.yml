name: GreenTurtle Raphael HyperOS4 SukiSU-Ultra builtin
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Soviet kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential libssl-dev libelf-dev bison flex pahole bc cpio unzip zip python3 python3-pip

      - name: Download Snapdragon LLVM 14.0.6
        run: |
          wget https://github.com/SoMainline/llvm-snapdragon/releases/download/sdllvm-14.0.6/llvm-snapdragon-14.0.6-x86_64-linux.tar.xz
          tar xf llvm-snapdragon-14.0.6-x86_64-linux.tar.xz

      - name: Inject SukiSU-Ultra builtin
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Config and Compile
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          CLANG_PATH=$PWD/llvm-snapdragon-14.0.6-x86_64-linux/bin
          export PATH=${CLANG_PATH}:${PATH}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out raphael_defconfig
          scripts/config --file out/.config --enable KALLSYMS
          scripts/config --file out/.config --enable KALLSYMS_ALL
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KPROBE_EVENTS
          scripts/config --file out/.config --disable KPM
          scripts/config --file out/.config --disable LTO
          scripts/config --file out/.config --disable THINLTO

          make -j$(nproc) O=out LLVM=1 LLVM_IAS=1

      - name: AnyKernel3 pack
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../GreenTurtle-Raphael-SukiSU.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenTurtle-Raphael-SukiSU
          path: GreenTurtle-Raphael-SukiSU.zip
