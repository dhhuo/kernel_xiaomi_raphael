name: GreenTurtle Raphael HyperOS4 SukiSU-Ultra builtin
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential libssl-dev libelf-dev bison flex pahole bc cpio unzip zip python3 python3-pip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download AOSP clang-r547379
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r547379.tar.gz
          mkdir -p clang-r547379
          tar xf clang-r547379.tar.gz -C clang-r547379

      - name: Integrate SukiSU-Ultra builtin
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Config and Compile
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          CLANG_PATH=$PWD/clang-r547379/bin
          export PATH=${CLANG_PATH}:${PATH}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out raphael_defconfig
          scripts/config --file out/.config --enable KALLSYMS
          scripts/config --file out/.config --enable KALLSYMS_ALL
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KPROBE_EVENTS
          scripts/config --file out/.config --disable KPM
          scripts/config --file out/.config --enable LTO_NONE
          scripts/config --file out/.config --disable LTO_CLANG
          scripts/config --file out/.config --disable THINLTO

          yes "" | make O=out oldconfig
          yes "" | make -j$(nproc) O=out LLVM=1 LLVM_IAS=1

      - name: AnyKernel3 pack
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          # 配置设备名 raphael (K20 Pro)
          sed -i 's/device.name1=/device.name1=raphael/' anykernel.sh
          sed -i 's/device.name2=/device.name2=raphaelin/' anykernel.sh
          sed -i 's/block.dev=/block.dev=boot/' anykernel.sh
          # 关闭校验（保险起见）
          sed -i 's/disable.device.check=0/disable.device.check=1/' anykernel.sh
          cd ..
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dts/qcom/sm8150-v2.dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../GreenTurtle-Raphael-SukiSU.zip *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenTurtle-Raphael-SukiSU
          path: GreenTurtle-Raphael-SukiSU.zip
